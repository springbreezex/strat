<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>天ノ宮略整合站</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b0e1a;
    --surface: #131829;
    --surface-2: #1a2038;
    --surface-3: #212847;
    --border: rgba(226, 232, 255, 0.09);
    --text: #eef0f8;
    --text-muted: #9aa2c0;
    --accent: #e0b454;
    --accent-strong: #f2c96b;
    --accent-teal: #5fd4c4;
    --accent-teal-strong: #7ee6d7;
    --danger: #ef7a7a;
    --role-tank: #7fa8f2;
    --role-heal: #7ee6a8;
    --role-dps: #ef8ba0;
    --shadow: 0 10px 30px rgba(0,0,0,0.35);
    --radius-sm: 8px;
    --radius-md: 14px;
    --radius-lg: 20px;
    --topbar-h: 56px;
    --sidebar-w: 280px;
    --font-display: 'Cinzel', 'Noto Serif TC', serif;
    --font-body: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
  }

  body.light{
    --bg: #f4f3ee;
    --surface: #ffffff;
    --surface-2: #f0eee6;
    --surface-3: #e9e6da;
    --border: rgba(20, 22, 40, 0.09);
    --text: #201f2b;
    --text-muted: #64607a;
    --accent: #b3781b;
    --accent-strong: #9c6512;
    --accent-teal: #0e8f82;
    --accent-teal-strong: #0b7469;
    --danger: #c74848;
    --role-tank: #3f74d6;
    --role-heal: #1f9e63;
    --role-dps: #c94f68;
    --shadow: 0 10px 24px rgba(30,25,10,0.08);
  }

  *{ box-sizing: border-box; }

  html{ scroll-behavior: smooth; }

  body{
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(1100px 520px at 85% -10%, rgba(95,212,196,0.08), transparent 60%),
      radial-gradient(900px 500px at -10% 10%, rgba(224,180,84,0.07), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    transition: background 0.25s ease, color 0.25s ease;
    -webkit-font-smoothing: antialiased;
  }

  a{ color: var(--accent-teal); }
  a:hover{ color: var(--accent-teal-strong); }

  :focus-visible{
    outline: 2px solid var(--accent-teal);
    outline-offset: 2px;
    border-radius: 4px;
  }

  button, [role="button"]{ font-family: inherit; }

  .app{
    display: flex;
    min-height: 100vh;
  }

  /* ---------- Mobile topbar ---------- */
  #mobile-topbar{
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--topbar-h);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    color: var(--text);
    align-items: center;
    gap: 12px;
    padding: 0 14px;
    z-index: 1000;
  }
  #menu-btn{
    display: flex;
    align-items: center;
    justify-content: center;
    width: 38px; height: 38px;
    border-radius: var(--radius-sm);
    background: var(--surface-2);
    border: 1px solid var(--border);
    cursor: pointer;
    flex-shrink: 0;
  }
  #menu-btn svg{ width: 18px; height: 18px; stroke: var(--text); }
  #mobile-title-row{
    display: flex;
    align-items: center;
    gap: 9px;
    cursor: pointer;
    overflow: hidden;
    min-width: 0;
  }
  #mobile-title-row .brand-logo{
    width: 26px;
    height: 26px;
    border-radius: 7px;
  }
  #mobile-title{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.5px;
    line-height: 1.3;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #mobile-theme-btn{
    margin-left: auto;
    width: 38px; height: 38px;
    border-radius: var(--radius-sm);
    background: var(--surface-2);
    border: 1px solid var(--border);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  #mobile-theme-btn svg{ width: 18px; height: 18px; stroke: var(--accent); }

  #backdrop{
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(4,6,14,0.55);
    z-index: 900;
  }
  #backdrop.show{ display: block; }

  /* ---------- Sidebar ---------- */
  #sidebar{
    width: var(--sidebar-w);
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: 100vh;
    position: sticky;
    top: 0;
  }

  .sidebar-brand{
    padding: 20px 18px 14px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-brand-eyebrow{
    font-family: var(--font-display);
    font-size: 11px;
    letter-spacing: 2.5px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .sidebar-brand-row{
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
  }
  .brand-logo{
    width: 34px;
    height: 34px;
    border-radius: 9px;
    flex-shrink: 0;
    object-fit: cover;
  }
  .sidebar-brand-name{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 19px;
    letter-spacing: 1px;
    line-height: 1.2;
  }
  .sidebar-brand-sub{
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
    line-height: 1.3;
  }
  .sidebar-brand-row:hover .sidebar-brand-name{ color: var(--accent-strong); }
  .sidebar-brand-title{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 16.5px;
    line-height: 1.45;
    cursor: pointer;
  }
  .sidebar-brand-title:hover{ color: var(--accent-strong); }

  .sidebar-search{
    padding: 14px 14px 8px;
  }
  .sidebar-search-box{
    position: relative;
  }
  .sidebar-search input{
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: var(--radius-sm);
    padding: 9px 12px 9px 32px;
    font-size: 13.5px;
    font-family: inherit;
  }
  .sidebar-search input::placeholder{ color: var(--text-muted); }
  .sidebar-search svg{
    position: absolute;
    left: 10px; top: 50%;
    transform: translateY(-50%);
    width: 15px; height: 15px;
    stroke: var(--text-muted);
    pointer-events: none;
  }

  #fightList{
    flex: 1;
    overflow-y: auto;
    padding: 10px 12px 12px;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #fightList::-webkit-scrollbar{ width: 8px; }
  #fightList::-webkit-scrollbar-thumb{ background: var(--surface-3); border-radius: 8px; }

  .fight-item{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 12px;
    border-radius: var(--radius-md);
    background: var(--surface-2);
    border: 1px solid transparent;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
  }
  .fight-item:hover{ background: var(--surface-3); transform: translateX(2px); }
  .fight-item.active{
    background: linear-gradient(135deg, rgba(224,180,84,0.16), rgba(95,212,196,0.10));
    border-color: rgba(224,180,84,0.4);
  }
  .fight-item-dot{
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent-teal);
    flex-shrink: 0;
    box-shadow: 0 0 0 3px rgba(95,212,196,0.15);
  }
  .fight-item.active .fight-item-dot{ background: var(--accent); box-shadow: 0 0 0 3px rgba(224,180,84,0.18); }
  .fight-item-text{
    font-size: 13.5px;
    line-height: 1.4;
    font-weight: 500;
  }
  .fight-empty{
    color: var(--text-muted);
    font-size: 13px;
    text-align: center;
    padding: 18px 8px;
  }

  .sidebar-bottom{
    padding: 12px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
  }
  .control-box{
    background: var(--surface-2);
    border: 1px solid var(--border);
    padding: 9px 12px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 13px;
    font-weight: 500;
    transition: background 0.15s ease;
  }
  .control-box:hover{ background: var(--surface-3); }
  .control-box svg{ width: 16px; height: 16px; stroke: var(--accent); flex-shrink: 0; }
  .sidebar-credit{
    font-size: 11px;
    color: var(--text-muted);
    text-align: center;
    padding-top: 2px;
  }

  /* ---------- Main ---------- */
  #main{
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .content-header{
    padding: 28px 34px 18px;
    border-bottom: 1px solid var(--border);
  }
  .breadcrumb{
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .breadcrumb .crumb-accent{ color: var(--accent-teal); }
  #fight-title{
    font-family: var(--font-display);
    font-size: 26px;
    font-weight: 600;
    line-height: 1.35;
    margin-bottom: 10px;
    letter-spacing: 0.2px;
  }
  #fight-desc{
    font-size: 14.5px;
    color: var(--text-muted);
    line-height: 1.75;
    max-width: 860px;
  }
  #fight-desc h2{
    font-family: var(--font-display);
    font-size: 15px;
    color: var(--accent);
    margin: 14px 0 6px;
    font-weight: 600;
  }
  #fight-desc img{ max-width: 100%; border-radius: var(--radius-sm); margin: 8px 0; }

  /* Phase rail */
  .phase-rail-wrap{
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 28px;
    overflow-x: auto;
  }
  .phase-rail-wrap::-webkit-scrollbar{ height: 6px; }
  .phase-rail{
    display: flex;
    align-items: center;
    min-width: max-content;
  }
  .phase-tab{
    display: flex;
    align-items: center;
    gap: 9px;
    cursor: pointer;
    padding: 6px 14px 6px 6px;
    border-radius: 999px;
    white-space: nowrap;
    transition: background 0.15s ease;
  }
  .phase-tab:hover{ background: var(--surface-2); }
  .phase-num{
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--surface-3);
    color: var(--text-muted);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display);
    font-size: 12px;
    font-weight: 600;
    flex-shrink: 0;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .phase-label{
    font-size: 13.5px;
    color: var(--text-muted);
    font-weight: 500;
    transition: color 0.15s ease;
  }
  .phase-tab.active .phase-num{
    background: var(--accent);
    color: #1a1305;
  }
  .phase-tab.active .phase-label{ color: var(--text); font-weight: 700; }
  .phase-connector{
    width: 26px;
    height: 2px;
    background: var(--border);
    flex-shrink: 0;
    margin: 0 2px;
  }

  /* Strategy chooser */
  .strategy-bar{
    padding: 14px 28px;
    background: var(--surface);
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }
  .strategy-btn{
    padding: 8px 16px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    cursor: pointer;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text-muted);
    transition: all 0.15s ease;
  }
  .strategy-btn:hover{ color: var(--text); border-color: rgba(95,212,196,0.4); }
  .strategy-btn.active{
    background: var(--accent-teal);
    color: #06251f;
    border-color: var(--accent-teal);
  }

  /* Homepage-only sections (hidden once a fight is selected) */
  .home-mode .phase-rail-wrap,
  .home-mode .strategy-bar{ display: none; }
  .phase-rail-wrap:has(#phase-tabs:empty){ display: none; } /* single-phase fights: no empty rail */
  #leaderboard-wrap{ display: none; }
  .home-mode #leaderboard-wrap{ display: block; }

  .lb-section-head{
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin: 6px 0 16px;
  }
  .lb-section-title{
    font-family: var(--font-display);
    font-size: 17px;
    font-weight: 700;
    color: var(--text);
  }
  .lb-section-sub{
    font-size: 12.5px;
    color: var(--text-muted);
  }

  .lb-card{
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    margin-bottom: 22px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .lb-card-header{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    padding: 14px 18px;
    background: linear-gradient(135deg, rgba(224,180,84,0.10), rgba(95,212,196,0.06));
    border-bottom: 1px solid var(--border);
  }
  .lb-fight-name{
    font-family: var(--font-display);
    font-size: 14.5px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 0.3px;
  }
  .lb-count-badge{
    font-size: 11.5px;
    font-weight: 700;
    color: var(--text-muted);
    background: var(--surface-2);
    border: 1px solid var(--border);
    padding: 3px 10px;
    border-radius: 999px;
    flex-shrink: 0;
  }

  .lb-table-wrap{ overflow-x: auto; }
  table.lb-table{
    width: 100%;
    border-collapse: collapse;
    min-width: 640px;
  }
  .lb-table thead th{
    text-align: left;
    font-family: var(--font-display);
    font-size: 11px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--text-muted);
    padding: 10px 18px;
    border-bottom: 1px solid var(--border);
    font-weight: 600;
  }
  .lb-table tbody tr{
    border-bottom: 1px solid var(--border);
    transition: background 0.15s ease;
  }
  .lb-table tbody tr:last-child{ border-bottom: none; }
  .lb-table tbody tr:hover{ background: var(--surface-2); }
  .lb-table td{
    padding: 13px 18px;
    vertical-align: middle;
    font-size: 13.5px;
  }
  .lb-team-cell{
    display: flex;
    align-items: center;
    gap: 9px;
    font-weight: 700;
    white-space: nowrap;
  }
  .lb-team-dot{
    width: 7px; height: 7px;
    border-radius: 50%;
    background: var(--accent-teal);
    flex-shrink: 0;
  }
  .lb-members{
    display: flex;
    flex-wrap: wrap;
    gap: 6px 10px;
    max-width: 380px;
  }
  .lb-member{
    display: inline-flex;
    align-items: center;
    gap: 5px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    padding: 3px 9px 3px 3px;
    font-size: 12px;
    color: var(--text-muted);
    white-space: nowrap;
  }
  .lb-job-icon{
    width: 20px; height: 20px;
    border-radius: 50%;
    object-fit: cover;
    flex-shrink: 0;
    background: var(--surface-3);
  }
  .lb-job-icon.role-tank{ box-shadow: 0 0 0 1.5px var(--role-tank); }
  .lb-job-icon.role-heal{ box-shadow: 0 0 0 1.5px var(--role-heal); }
  .lb-job-icon.role-dps{ box-shadow: 0 0 0 1.5px var(--role-dps); }
  .lb-period{
    display: inline-block;
    font-size: 12px;
    font-weight: 600;
    color: var(--text-muted);
    background: var(--surface-2);
    border: 1px solid var(--border);
    padding: 5px 11px;
    border-radius: var(--radius-sm);
    line-height: 1.5;
    max-width: 220px;
  }
  .lb-empty-row td{
    color: var(--text-muted);
    font-size: 13px;
    text-align: center;
    padding: 22px 18px;
  }

  /* Case switcher: several images in one 圖例 cell */
  .case-set{
    display: flex;
    flex-direction: column;
    align-items: flex-start;
    gap: 10px;
    max-width: 100%;
  }
  .case-tabs{
    display: inline-flex;
    gap: 2px;
    padding: 3px;
    max-width: 100%;
    overflow-x: auto;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 999px;
  }
  .case-tab{
    border: 0;
    background: transparent;
    color: var(--text-muted);
    font-size: 12.5px;
    font-weight: 700;
    padding: 5px 13px;
    border-radius: 999px;
    cursor: pointer;
    white-space: nowrap;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .case-tab:hover{ color: var(--text); }
  .case-tab[aria-pressed="true"]{
    background: var(--accent-teal);
    color: #06251f;
  }
  .case-stage{ max-width: 100%; }
  #content .case-stage img[hidden]{ display: none; }

  /* Click-to-enlarge images */
  #content img.zoomable{
    cursor: zoom-in;
    transition: box-shadow 0.15s ease, filter 0.15s ease;
  }
  #content img.zoomable:hover{
    filter: brightness(1.06);
    box-shadow: 0 0 0 2px var(--accent-teal);
  }

  /* Image pop-up (lightbox) */
  #zoom-overlay{
    position: fixed;
    inset: 0;
    z-index: 2000;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 12px;
    padding: 56px 12px 20px;
    background: rgba(4, 6, 14, 0.88);
    -webkit-backdrop-filter: blur(4px);
    backdrop-filter: blur(4px);
    touch-action: pinch-zoom;
  }
  #zoom-overlay.open{ display: flex; animation: fadeIn 0.15s ease; }
  #zoom-img{
    max-width: 96vw;
    max-height: calc(100vh - 120px);
    object-fit: contain;
    border-radius: 10px;
    background: var(--surface);
    box-shadow: 0 20px 60px rgba(0,0,0,0.5);
    cursor: zoom-out;
  }
  #zoom-cap{
    color: #e8eaf5;
    font-size: 13px;
    min-height: 1.2em;
    text-align: center;
  }
  #zoom-close{
    position: absolute;
    top: 12px;
    right: 12px;
    width: 42px;
    height: 42px;
    border-radius: 50%;
    border: 1px solid rgba(255,255,255,0.25);
    background: rgba(255,255,255,0.12);
    color: #fff;
    font-size: 22px;
    line-height: 1;
    cursor: pointer;
  }
  #zoom-close:hover{ background: rgba(255,255,255,0.22); }

  /* Content */
  .content-panel{
    padding: 26px 34px 60px;
    flex: 1;
  }
  #content{
    max-width: 980px;
    font-size: 15px;
    line-height: 1.85;
    animation: fadeIn 0.25s ease;
  }
  @keyframes fadeIn{ from{ opacity: 0; transform: translateY(4px); } to{ opacity: 1; transform: translateY(0); } }

  #content p{ margin: 0 0 14px; }
  #content h2{
    font-family: var(--font-display);
    font-size: 17px;
    font-weight: 600;
    color: var(--accent);
    margin: 22px 0 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  #content h2:first-child{ margin-top: 0; }
  #content b{ color: var(--accent-teal-strong); font-weight: 700; }
  #content img{ max-width: 100%; height: auto; border-radius: var(--radius-sm);}
  #content > img{ margin: 10px 0 16px; box-shadow: var(--shadow); }
  #content a{ font-weight: 600; text-decoration: underline; text-decoration-color: rgba(95,212,196,0.4); text-underline-offset: 3px; }

  .table-wrap{
    overflow-x: auto;
    margin: 4px 0 18px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    background: var(--surface);
  }
  table.table-style{
    border-collapse: collapse;
    width: 100%;
    min-width: 560px;
  }
  .table-style td, .table-style th{
    border: 1px solid var(--border);
    padding: 14px 16px;
    text-align: left;
    vertical-align: top;
  }
  .table-style th{
    background: var(--surface-2);
    font-family: var(--font-display);
    font-size: 12.5px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--accent);
  }
  .table-style tr:nth-child(even) td{ background: rgba(255,255,255,0.015); }
  .table-style h2{
    margin: 0;
    padding: 0;
    border: none;
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--surface-3);
    color: var(--accent);
    font-family: var(--font-display);
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
  }
  .table-style img{ margin: 0; }

  .empty-state{
    color: var(--text-muted);
    font-size: 14px;

          "黑洞 (DSA Double)": {
            tag: "blackhole",
            content: `
<b>機制詳解:</b> <br>
此階段需要處理四個機制，分別爲可目標的雙體對象(小黃，小藍)，場外非目標對象(巨型小丑)，及場地黑洞機制。<br>
此攻略會先說明每個分開機制，再整合說明流程<br><br>

<b>小黃</b> - カオス / 混沌 / Chaos<br>
<b>小藍</b> - エクスデス / 艾克斯迪司 / Exdeath<br>
<b>小丑</b> - 場外卡夫卡<br>
<table class="table-style">

<tr><td>小黃</td><td><b>亂打</b><br>ダビングイーディクト / Damning Edict<br>小黃會面向隨機一名玩家，並對前方進行半場AOE，留意面向躲避即可。<br><br><b>前後/左右擊<br></b>根據讀條進行兩次扇形攻擊:<br><b>ヴァーティカルインプロージョン/Longitude:</b> 先打前後，再打左右<br><b>ホリゾンタルインプロージョン/Latitude:</b> 先打左右，再打前後<br>跟前半決鬥一樣，躲避即可。</td><td><img src="assets/images/fight/ult-umad/p3-bh-chaos1.png" data-case="亂打" width="400"><img src="assets/images/fight/ult-umad/p3-bh-chaos2a.png" data-case="前後擊" width="400"><img src="assets/images/fight/ult-umad/p3-bh-chaos2b.png" data-case="左右擊" width="400"></td></tr>
<tr><td>小藍</td><td><b>坦死刑</b><br>サンダガ / Thunder III<br>小藍會連續兩次對最近距離的坦克進行死刑攻擊。</td><td><img src="assets/images/fight/ult-umad/p3-bh-exdeath.png" data-case="死刑" width="400"></td></tr>
<tr><td>小丑</td><td><b>舉手拍拍拍</b><br>ビンビンビンタ / 連掌扇形拍擊 / Slap Happy<br>小丑會舉左右手，並對該側半場進行三次AOE拍地板。<br>同時中間會有鋼鐵AOE及 根據舉起的手進行 <b>8人分攤或職能散開</b> (以小丑爲北THD)<br><b>舉左手:</b> 在左側安地進行職能散開(以小丑爲北THD)<br><b>舉右手:</b> 在右側安地進行8人分攤<br><br><b>平躺</b><br>ありのままのボクチン / Look Upon Me<br>小丑會跳到場中平躺，如圖進行直線AOE，躲避即可。</td><td><img src="assets/images/fight/ult-umad/p3-bh-kefkaL.png" data-case="舉手拍拍拍(左)" width="400"><img src="assets/images/fight/ult-umad/p3-bh-kefkaR.png" data-case="舉手拍拍拍(右)" width="400"><img src="assets/images/fight/ult-umad/p3-bh-kefkaslam.png" data-case="平躺" width="400"></td></tr>
<tr><td>黑洞</td><td>場上會生成若干數量的<b>黑洞</b>，避免碰到否則會得到Damage Down效果。<br>同時其中1-3個正點黑洞會生成一條連接到玩家的線(可轉讓)，<br>玩家要根據自己的數字{umad_fil_debuff}{umad_sil_debuff}{umad_til_debuff}debuff及是否持有{umad_accretion_debuff}debuff決定取線次序。<br>流程解說會說明如何判定自己取線次序。<br><br>整個機制會有24條線，每名玩家會在整個機制中先後接3次線處理。</td><td><img src="assets/images/fight/ult-umad/p3-bh-blackholes.png" data-case="黑洞" width="400"></td></tr>
</tbody></table>
<br><br>
<b>流程解說:</b> <br>

function jobIconHTML(jobKey) {
  const key = String(jobKey || '').toLowerCase();
  const meta = JOB_META[key] || { role: 'dps', label: key.toUpperCase().slice(0, 3) || '?' };
  const src = 'assets/images/jobs/' + key + '.png';

  return `<img class="lb-job-icon role-${meta.role}" src="${src}" alt="${meta.label}" title="${meta.label}" onerror="this.onerror=null;this.src='${fb}';">`;
}

function renderLeaderboards() {
  const list = document.getElementById('leaderboard-list');
  list.innerHTML = '';

  Object.keys(data).forEach(fightName => {
    const teams = teamsData[fightName] || [];

    const card = document.createElement('div');
    card.className = 'lb-card';

    const header = document.createElement('div');
    header.className = 'lb-card-header';
    header.innerHTML = `<span class="lb-fight-name">${fightName}</span><span class="lb-count-badge">${teams.length} 隊伍</span>`;
    card.appendChild(header);

    const tableWrap = document.createElement('div');
    tableWrap.className = 'lb-table-wrap';

    const table = document.createElement('table');
    table.className = 'lb-table';

    let bodyRows;
    if (teams.length === 0) {
      bodyRows = `<tr class="lb-empty-row"><td colspan="3">尚無隊伍資料</td></tr>`;
    } else {
      bodyRows = teams.map(team => {
        const membersHTML = (team.players || []).map(p =>
          `<span class="lb-member">${jobIconHTML(p.job)}<span>${p.name}</span></span>`
        ).join('');
        return `
          <tr>
            <td><span class="lb-team-cell"><span class="lb-team-dot"></span>${team.name}</span></td>
            <td><div class="lb-members">${membersHTML}</div></td>
            <td><span class="lb-period">${team.period || ''}</span></td>
          </tr>`;
      }).join('');
    }

    table.innerHTML = `
      <thead><tr><th>隊伍</th><th>成員</th><th>進度 / 備註</th></tr></thead>
      <tbody>${bodyRows}</tbody>`;

    tableWrap.appendChild(table);
    card.appendChild(tableWrap);
    list.appendChild(card);
  });
}

function renderFights() {
  const container = document.getElementById('fightList');
  const query = (document.getElementById('fightSearch').value || '').trim().toLowerCase();
  container.innerHTML = '';

  const names = Object.keys(data).filter(name => name.toLowerCase().includes(query));

  if (names.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'fight-empty';
    empty.innerText = '找不到符合的副本';
    container.appendChild(empty);
    return;
  }

  names.forEach(fight => {
    const div = document.createElement('div');
    div.className = 'fight-item' + (fight === currentFight ? ' active' : '');
    div.setAttribute('role', 'button');
    div.setAttribute('tabindex', '0');

    const dot = document.createElement('span');
    dot.className = 'fight-item-dot';

    const text = document.createElement('span');
    text.className = 'fight-item-text';
    text.innerText = fight;

    div.appendChild(dot);
    div.appendChild(text);

    const activate = () => { selectFight(fight); closeMenu(); };
    div.onclick = activate;
    div.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(); } };

    container.appendChild(div);
  });
}

/* ---------------------------------------------------------------
   URL hash routing
   Supported formats:
     #fight:tea                          -> fight only (shorthand)
     #fight=tea                          -> fight only
     #fight=tea&phase=p2                 -> fight + phase (by tag)
     #fight=tea&phase=2                  -> fight + phase (by 1-based order)
     #fight=tea&phase=p2&strat=naur      -> fight + phase + strategy (by tag)
   Any tag that doesn't match the data falls back gracefully:
   an unknown fight tag returns to the home page; an unknown
   phase/strategy tag simply falls back to that fight's first
   phase/strategy instead of discarding a valid fight match.
   ------------------------------------------------------------- */

function findFightKeyByTag(tag) {
  if (!tag) return null;
  const t = String(tag).toLowerCase();
  return Object.keys(data).find(k => (data[k].tag || '').toLowerCase() === t) || null;
}

function findPhaseKeyByTag(fightKey, tag) {
  if (!tag || !data[fightKey]) return null;
  const phases = data[fightKey].phases;
  const keys = Object.keys(phases);
  const t = String(tag);
  if (/^\d+$/.test(t)) {
    const idx = parseInt(t, 10) - 1;
    return (idx >= 0 && idx < keys.length) ? keys[idx] : null;
  }
  const lower = t.toLowerCase();
  return keys.find(k => (phases[k].tag || '').toLowerCase() === lower) || null;
}

function findStrategyKeyByTag(fightKey, phaseKey, tag) {
  if (!tag || !phaseKey || !data[fightKey] || !data[fightKey].phases[phaseKey]) return null;
  const strategies = data[fightKey].phases[phaseKey].strategies;
  const t = String(tag).toLowerCase();
  return Object.keys(strategies).find(k => (strategies[k].tag || '').toLowerCase() === t) || null;
}

function parseHash() {
  let raw = location.hash || '';
  if (raw.charAt(0) === '#') raw = raw.slice(1);
  raw = raw.trim();
  if (!raw) return null;

  let fightTag = null, phaseTag = null, stratTag = null;

  if (raw.indexOf('=') === -1 && raw.indexOf(':') !== -1) {
    // shorthand form: fight:tea
    const m = raw.match(/^fight:(.+)$/i);
    if (m) fightTag = decodeURIComponent(m[1]);
  } else {
    const params = new URLSearchParams(raw);
    if (params.has('fight')) fightTag = params.get('fight');
    if (params.has('phase')) phaseTag = params.get('phase');
    if (params.has('strat')) stratTag = params.get('strat');
  }
  return { fightTag, phaseTag, stratTag };
}

function updateHash() {
  let newHash = '';
  if (currentFight && data[currentFight]) {
    const parts = ['fight=' + encodeURIComponent(data[currentFight].tag)];
    if (currentPhase && data[currentFight].phases[currentPhase]) {
      parts.push('phase=' + encodeURIComponent(data[currentFight].phases[currentPhase].tag));
      const strategies = data[currentFight].phases[currentPhase].strategies;
      if (currentStrategy && strategies[currentStrategy]) {
        parts.push('strat=' + encodeURIComponent(strategies[currentStrategy].tag));
      }
    }
    newHash = '#' + parts.join('&');
  }
  if ((location.hash || '') !== newHash) {
    const base = location.pathname + location.search;
    history.replaceState(null, '', newHash ? base + newHash : base);
  }
}

function applyHashRoute() {
  const parsed = parseHash();
  if (!parsed || !parsed.fightTag) { goHome(); return; }

  const fightKey = findFightKeyByTag(parsed.fightTag);
  if (!fightKey) { goHome(); return; } // unmatched tag -> home page, and the bad hash is cleared

  const phaseKey = parsed.phaseTag ? findPhaseKeyByTag(fightKey, parsed.phaseTag) : null;
  const stratKey = (phaseKey && parsed.stratTag) ? findStrategyKeyByTag(fightKey, phaseKey, parsed.stratTag) : null;

  // skipHashUpdate: true avoids rewriting a hash that's already valid; showContent()
  // still normalizes it (e.g. a numeric phase index becomes its canonical tag) the
  // next time the person interacts with the page.
  selectFight(fightKey, { phase: phaseKey, strategy: stratKey, skipHashUpdate: true });
}

function updateBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  if (!currentFight) { bc.innerHTML = ''; return; }
  let parts = [`<span onclick="goHome()" style="cursor:pointer;">副本列表</span>`, `<span>›</span>`, `<span class="crumb-accent">${currentFight}</span>`];
  if (currentPhase && Object.keys(data[currentFight].phases).length > 1) {
    parts.push('<span>›</span>');
    parts.push(`<span class="crumb-accent">${currentPhase}</span>`);
  }
  bc.innerHTML = parts.join(' ');
}

function goHome(opts) {
  opts = opts || {};
  currentFight = null;
  currentPhase = null;
  currentStrategy = null;
  document.getElementById('fight-title').innerText = DEFAULT_TITLE;
  document.getElementById('fight-desc').innerHTML = DEFAULT_DESC;
  document.getElementById('phase-tabs').innerHTML = '';
  document.getElementById('strategy-buttons').innerHTML = '';
  document.getElementById('content').innerHTML = '';
  document.getElementById('main').classList.add('home-mode');
  renderLeaderboards();
  updateBreadcrumb();
  renderFights();
  closeMenu();
  if (!opts.skipHashUpdate) updateHash();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function selectFight(fight, opts) {
  opts = opts || {};
  currentFight = fight;
  document.getElementById('fight-title').innerText = fight;
  document.getElementById('fight-desc').innerHTML = applyReplacements(data[fight].description) || '';
  document.getElementById('main').classList.remove('home-mode');
  renderFights();
  renderPhases(opts.phase, opts.strategy, opts.skipHashUpdate);
  updateBreadcrumb();
  closeMenu();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderPhases(preferredPhase, preferredStrategy, skipHashUpdate) {
  const phaseTabs = document.getElementById('phase-tabs');
  phaseTabs.innerHTML = '';
  const phases = data[currentFight].phases;
  const keys = Object.keys(phases);

  if (keys.length <= 1) {
    currentPhase = keys[0];
    renderStrategies(preferredStrategy, skipHashUpdate);
    updateBreadcrumb();
    return;
  }

  keys.forEach((phase, idx) => {
    if (idx > 0) {
      const connector = document.createElement('div');
      connector.className = 'phase-connector';
      phaseTabs.appendChild(connector);
    }

    const tab = document.createElement('div');
    tab.className = 'phase-tab';
    tab.dataset.phase = phase;
    tab.setAttribute('role', 'tab');
    tab.setAttribute('tabindex', '0');

    const num = document.createElement('span');
    num.className = 'phase-num';
    num.innerText = idx + 1;

    const label = document.createElement('span');
    label.className = 'phase-label';
    label.innerText = phase;

    tab.appendChild(num);
    tab.appendChild(label);

    const activate = () => {
      currentPhase = phase;
      renderStrategies();
      document.querySelectorAll('.phase-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      updateBreadcrumb();
    };
    tab.onclick = activate;
    tab.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(); } };

    phaseTabs.appendChild(tab);
  });

  const tabs = Array.from(phaseTabs.querySelectorAll('.phase-tab'));
  currentPhase = (preferredPhase && phases[preferredPhase]) ? preferredPhase : keys[0];
  const matchTab = tabs.find(t => t.dataset.phase === currentPhase) || tabs[0];
  if (matchTab) matchTab.classList.add('active');
  renderStrategies(preferredStrategy, skipHashUpdate);
}

function renderStrategies(preferredStrategy, skipHashUpdate) {
  const container = document.getElementById('strategy-buttons');
  container.innerHTML = '';
  const strategies = data[currentFight].phases[currentPhase].strategies;
  const keys = Object.keys(strategies);

  keys.forEach(name => {
    const btn = document.createElement('div');
    btn.className = 'strategy-btn';
    btn.dataset.strategy = name;
    btn.innerText = name;
    btn.setAttribute('role', 'button');
    btn.setAttribute('tabindex', '0');
    btn.onclick = () => showContent(name, btn);
    btn.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); showContent(name, btn); } };
    container.appendChild(btn);
  });

  const target = (preferredStrategy && strategies[preferredStrategy]) ? preferredStrategy : keys[0];
  if (target) {
    const targetBtn = Array.from(container.children).find(b => b.dataset.strategy === target);
    showContent(target, targetBtn, skipHashUpdate);
  }
}

function showContent(name, btnElement, skipHashUpdate) {
  currentStrategy = name;
  document.querySelectorAll('.strategy-btn').forEach(b => b.classList.remove('active'));
  if (btnElement) btnElement.classList.add('active');

  const contentDiv = document.getElementById('content');
  let raw = data[currentFight].phases[currentPhase].strategies[name].content;
  let html = applyReplacements(raw);
  html = html.replace(/<table class="table-style">/g, '<div class="table-wrap"><table class="table-style">');
  html = html.replace(/<\/table>/g, '</table></div>');
  closeZoom();
  contentDiv.innerHTML = html;
  enhanceContentImages(contentDiv);

  if (!skipHashUpdate) updateHash();
}

/* ---------------------------------------------------------------
   Content image enhancements
   1) Case switcher: when a table cell holds 2+ legend images, they are
      grouped and a small button row lets the reader switch between
      cases. Authors only need to put several <img> in the cell and
      optionally label each with data-case="情況名稱".
   2) Click-to-enlarge: any legend image opens in a pop-up.
   Small inline icons (height:20px) are ignored by both.
   ------------------------------------------------------------- */

function isIconImg(img) {
  return /height:\s*20px/.test(img.getAttribute('style') || '');
}

function enhanceContentImages(root) {
  root.querySelectorAll('td').forEach(td => {
    const imgs = Array.from(td.querySelectorAll('img')).filter(i => !isIconImg(i));
    if (imgs.length < 2) return;

    const set = document.createElement('div');
    set.className = 'case-set';
    const tabs = document.createElement('div');
    tabs.className = 'case-tabs';
    tabs.setAttribute('role', 'group');
    tabs.setAttribute('aria-label', '切換情況');
    const stage = document.createElement('div');
    stage.className = 'case-stage';

    imgs[0].parentNode.insertBefore(set, imgs[0]);
    set.appendChild(tabs);
    set.appendChild(stage);

    const buttons = [];
    const select = (idx) => {
      imgs.forEach((img, i) => { img.hidden = (i !== idx); });
      buttons.forEach((b, i) => b.setAttribute('aria-pressed', i === idx ? 'true' : 'false'));
    };

    imgs.forEach((img, i) => {
      const label = img.getAttribute('data-case') || ('情況 ' + (i + 1));
      img.setAttribute('data-case', label);
      if (!img.getAttribute('alt')) img.setAttribute('alt', label);
      stage.appendChild(img);

      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'case-tab';
      btn.textContent = label;
      btn.onclick = () => select(i);
      tabs.appendChild(btn);
      buttons.push(btn);
    });
    select(0);
  });

  root.querySelectorAll('img').forEach(img => {
    if (isIconImg(img)) return;
    img.classList.add('zoomable');
    img.tabIndex = 0;
    img.setAttribute('role', 'button');
    const label = img.getAttribute('data-case');
    img.setAttribute('aria-label', label ? '放大圖片：' + label : '放大圖片');
  });
}

let zoomLastFocus = null;

function openZoom(img) {
  const overlay = document.getElementById('zoom-overlay');
  const zImg = document.getElementById('zoom-img');
  zImg.src = img.currentSrc || img.src;
  zImg.alt = img.getAttribute('alt') || '';
  document.getElementById('zoom-cap').textContent = img.getAttribute('data-case') || '';
  zoomLastFocus = document.activeElement;
  overlay.classList.add('open');
  overlay.setAttribute('aria-hidden', 'false');
  document.body.style.overflow = 'hidden';
  document.getElementById('zoom-close').focus();
}

function closeZoom() {
  const overlay = document.getElementById('zoom-overlay');
  if (!overlay.classList.contains('open')) return;
  overlay.classList.remove('open');
  overlay.setAttribute('aria-hidden', 'true');
  document.getElementById('zoom-img').removeAttribute('src');
  document.body.style.overflow = '';
  if (zoomLastFocus && zoomLastFocus.focus) zoomLastFocus.focus();
  zoomLastFocus = null;
}

function initImageZoom() {
  const content = document.getElementById('content');
  content.addEventListener('click', (e) => {
    const img = e.target.closest && e.target.closest('img.zoomable');
    if (img) openZoom(img);
  });
  content.addEventListener('keydown', (e) => {
    if ((e.key === 'Enter' || e.key === ' ') && e.target.classList && e.target.classList.contains('zoomable')) {
      e.preventDefault();
      openZoom(e.target);
    }
  });
  document.getElementById('zoom-overlay').addEventListener('click', closeZoom);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeZoom(); });
}

function applyTheme(isLight) {
  document.body.classList.toggle('light', isLight);
  const label = document.getElementById('themeLabel');
  const arcPath = 'M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z';
  const sunPaths = `<circle cx="12" cy="12" r="4"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>`;
  if (label) label.innerText = isLight ? '切換為深色模式' : '切換為淺色模式';
  document.querySelectorAll('#themeIcon, #mobile-theme-btn svg').forEach(icon => {
    icon.innerHTML = isLight ? sunPaths : `<path d="${arcPath}"></path>`;
  });
}

function toggleTheme() {
  const isLight = !document.body.classList.contains('light');
  applyTheme(isLight);
  try { localStorage.setItem('strat-theme', isLight ? 'light' : 'dark'); } catch (e) {}
}

function toggleMenu() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('backdrop').classList.toggle('show');
}

function closeMenu() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('backdrop').classList.remove('show');
}

initImageZoom();
window.addEventListener('hashchange', applyHashRoute);

(function init() {
  let saved = null;
  try { saved = localStorage.getItem('strat-theme'); } catch (e) {}
  applyTheme(saved === 'light');
  applyHashRoute();
})();
</script>
