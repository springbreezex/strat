<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>地方的哈魯不想讓你知道的攻略整合站</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Noto+Sans+TC:wght@400;500;700;900&family=Noto+Serif+TC:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #0b0e1a;
    --surface: #131829;
    --surface-2: #1a2038;
    --surface-3: #212847;
    --border: rgba(226, 232, 255, 0.09);
    --text: #eef0f8;
    --text-muted: #9aa2c0;
    --accent: #e0b454;
    --accent-strong: #f2c96b;
    --accent-teal: #5fd4c4;
    --accent-teal-strong: #7ee6d7;
    --danger: #ef7a7a;
    --shadow: 0 10px 30px rgba(0,0,0,0.35);
    --radius-sm: 8px;
    --radius-md: 14px;
    --radius-lg: 20px;
    --topbar-h: 56px;
    --sidebar-w: 280px;
    --font-display: 'Cinzel', 'Noto Serif TC', serif;
    --font-body: 'Noto Sans TC', 'PingFang TC', 'Microsoft JhengHei', system-ui, sans-serif;
  }

  body.light{
    --bg: #f4f3ee;
    --surface: #ffffff;
    --surface-2: #f0eee6;
    --surface-3: #e9e6da;
    --border: rgba(20, 22, 40, 0.09);
    --text: #201f2b;
    --text-muted: #64607a;
    --accent: #b3781b;
    --accent-strong: #9c6512;
    --accent-teal: #0e8f82;
    --accent-teal-strong: #0b7469;
    --danger: #c74848;
    --shadow: 0 10px 24px rgba(30,25,10,0.08);
  }

  *{ box-sizing: border-box; }

  html{ scroll-behavior: smooth; }

  body{
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(1100px 520px at 85% -10%, rgba(95,212,196,0.08), transparent 60%),
      radial-gradient(900px 500px at -10% 10%, rgba(224,180,84,0.07), transparent 55%),
      var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    transition: background 0.25s ease, color 0.25s ease;
    -webkit-font-smoothing: antialiased;
  }

  a{ color: var(--accent-teal); }
  a:hover{ color: var(--accent-teal-strong); }

  :focus-visible{
    outline: 2px solid var(--accent-teal);
    outline-offset: 2px;
    border-radius: 4px;
  }

  button, [role="button"]{ font-family: inherit; }

  .app{
    display: flex;
    min-height: 100vh;
  }

  /* ---------- Mobile topbar ---------- */
  #mobile-topbar{
    display: none;
    position: fixed;
    top: 0; left: 0; right: 0;
    height: var(--topbar-h);
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    color: var(--text);
    align-items: center;
    gap: 12px;
    padding: 0 14px;
    z-index: 1000;
  }
  #menu-btn{
    display: flex;
    align-items: center;
    justify-content: center;
    width: 38px; height: 38px;
    border-radius: var(--radius-sm);
    background: var(--surface-2);
    border: 1px solid var(--border);
    cursor: pointer;
    flex-shrink: 0;
  }
  #menu-btn svg{ width: 18px; height: 18px; stroke: var(--text); }
  #mobile-title-row{
    display: flex;
    align-items: center;
    gap: 9px;
    cursor: pointer;
    overflow: hidden;
    min-width: 0;
  }
  #mobile-title-row .brand-logo{
    width: 26px;
    height: 26px;
    border-radius: 7px;
  }
  #mobile-title{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 15px;
    letter-spacing: 0.5px;
    line-height: 1.3;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  #mobile-theme-btn{
    margin-left: auto;
    width: 38px; height: 38px;
    border-radius: var(--radius-sm);
    background: var(--surface-2);
    border: 1px solid var(--border);
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  #mobile-theme-btn svg{ width: 18px; height: 18px; stroke: var(--accent); }

  #backdrop{
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(4,6,14,0.55);
    z-index: 900;
  }
  #backdrop.show{ display: block; }

  /* ---------- Sidebar ---------- */
  #sidebar{
    width: var(--sidebar-w);
    flex-shrink: 0;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    height: 100vh;
    position: sticky;
    top: 0;
  }

  .sidebar-brand{
    padding: 20px 18px 14px;
    border-bottom: 1px solid var(--border);
  }
  .sidebar-brand-eyebrow{
    font-family: var(--font-display);
    font-size: 11px;
    letter-spacing: 2.5px;
    color: var(--accent);
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .sidebar-brand-row{
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
  }
  .brand-logo{
    width: 34px;
    height: 34px;
    border-radius: 9px;
    flex-shrink: 0;
    object-fit: cover;
    background: var(--surface-2);
    border: 1px solid var(--border);
    box-shadow: 0 0 0 3px rgba(224,180,84,0.08);
  }
  .sidebar-brand-name{
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 19px;
    letter-spacing: 1px;
    line-height: 1.2;
  }
  .sidebar-brand-sub{
    font-size: 11px;
    color: var(--text-muted);
    margin-top: 2px;
    line-height: 1.3;
  }
  .sidebar-brand-row:hover .sidebar-brand-name{ color: var(--accent-strong); }
  .sidebar-brand-title{
    font-family: var(--font-display);
    font-weight: 600;
    font-size: 16.5px;
    line-height: 1.45;
    cursor: pointer;
  }
  .sidebar-brand-title:hover{ color: var(--accent-strong); }

  .sidebar-search{
    padding: 14px 14px 8px;
  }
  .sidebar-search-box{
    position: relative;
  }
  .sidebar-search input{
    width: 100%;
    background: var(--surface-2);
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: var(--radius-sm);
    padding: 9px 12px 9px 32px;
    font-size: 13.5px;
    font-family: inherit;
  }
  .sidebar-search input::placeholder{ color: var(--text-muted); }
  .sidebar-search svg{
    position: absolute;
    left: 10px; top: 50%;
    transform: translateY(-50%);
    width: 15px; height: 15px;
    stroke: var(--text-muted);
    pointer-events: none;
  }

  #fightList{
    flex: 1;
    overflow-y: auto;
    padding: 10px 12px 12px;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  #fightList::-webkit-scrollbar{ width: 8px; }
  #fightList::-webkit-scrollbar-thumb{ background: var(--surface-3); border-radius: 8px; }

  .fight-item{
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px 12px;
    border-radius: var(--radius-md);
    background: var(--surface-2);
    border: 1px solid transparent;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
  }
  .fight-item:hover{ background: var(--surface-3); transform: translateX(2px); }
  .fight-item.active{
    background: linear-gradient(135deg, rgba(224,180,84,0.16), rgba(95,212,196,0.10));
    border-color: rgba(224,180,84,0.4);
  }
  .fight-item-dot{
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--accent-teal);
    flex-shrink: 0;
    box-shadow: 0 0 0 3px rgba(95,212,196,0.15);
  }
  .fight-item.active .fight-item-dot{ background: var(--accent); box-shadow: 0 0 0 3px rgba(224,180,84,0.18); }
  .fight-item-text{
    font-size: 13.5px;
    line-height: 1.4;
    font-weight: 500;
  }
  .fight-empty{
    color: var(--text-muted);
    font-size: 13px;
    text-align: center;
    padding: 18px 8px;
  }

  .sidebar-bottom{
    padding: 12px;
    border-top: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
  }
  .control-box{
    background: var(--surface-2);
    border: 1px solid var(--border);
    padding: 9px 12px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 9px;
    font-size: 13px;
    font-weight: 500;
    transition: background 0.15s ease;
  }
  .control-box:hover{ background: var(--surface-3); }
  .control-box svg{ width: 16px; height: 16px; stroke: var(--accent); flex-shrink: 0; }
  .sidebar-credit{
    font-size: 11px;
    color: var(--text-muted);
    text-align: center;
    padding-top: 2px;
  }

  /* ---------- Main ---------- */
  #main{
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }

  .content-header{
    padding: 28px 34px 18px;
    border-bottom: 1px solid var(--border);
  }
  .breadcrumb{
    font-size: 12px;
    color: var(--text-muted);
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }
  .breadcrumb .crumb-accent{ color: var(--accent-teal); }
  #fight-title{
    font-family: var(--font-display);
    font-size: 26px;
    font-weight: 600;
    line-height: 1.35;
    margin-bottom: 10px;
    letter-spacing: 0.2px;
  }
  #fight-desc{
    font-size: 14.5px;
    color: var(--text-muted);
    line-height: 1.75;
    max-width: 860px;
  }
  #fight-desc h2{
    font-family: var(--font-display);
    font-size: 15px;
    color: var(--accent);
    margin: 14px 0 6px;
    font-weight: 600;
  }
  #fight-desc img{ max-width: 100%; border-radius: var(--radius-sm); margin: 8px 0; }

  /* Phase rail */
  .phase-rail-wrap{
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 14px 28px;
    overflow-x: auto;
  }
  .phase-rail-wrap::-webkit-scrollbar{ height: 6px; }
  .phase-rail{
    display: flex;
    align-items: center;
    min-width: max-content;
  }
  .phase-tab{
    display: flex;
    align-items: center;
    gap: 9px;
    cursor: pointer;
    padding: 6px 14px 6px 6px;
    border-radius: 999px;
    white-space: nowrap;
    transition: background 0.15s ease;
  }
  .phase-tab:hover{ background: var(--surface-2); }
  .phase-num{
    width: 26px; height: 26px;
    border-radius: 50%;
    background: var(--surface-3);
    color: var(--text-muted);
    display: flex; align-items: center; justify-content: center;
    font-family: var(--font-display);
    font-size: 12px;
    font-weight: 600;
    flex-shrink: 0;
    transition: background 0.15s ease, color 0.15s ease;
  }
  .phase-label{
    font-size: 13.5px;
    color: var(--text-muted);
    font-weight: 500;
    transition: color 0.15s ease;
  }
  .phase-tab.active .phase-num{
    background: var(--accent);
    color: #1a1305;
  }
  .phase-tab.active .phase-label{ color: var(--text); font-weight: 700; }
  .phase-connector{
    width: 26px;
    height: 2px;
    background: var(--border);
    flex-shrink: 0;
    margin: 0 2px;
  }

  /* Strategy chooser */
  .strategy-bar{
    padding: 14px 28px;
    background: var(--surface);
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    border-bottom: 1px solid var(--border);
  }
  .strategy-btn{
    padding: 8px 16px;
    background: var(--surface-2);
    border: 1px solid var(--border);
    border-radius: 999px;
    cursor: pointer;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--text-muted);
    transition: all 0.15s ease;
  }
  .strategy-btn:hover{ color: var(--text); border-color: rgba(95,212,196,0.4); }
  .strategy-btn.active{
    background: var(--accent-teal);
    color: #06251f;
    border-color: var(--accent-teal);
  }

  /* Content */
  .content-panel{
    padding: 26px 34px 60px;
    flex: 1;
  }
  #content{
    max-width: 980px;
    font-size: 15px;
    line-height: 1.85;
    animation: fadeIn 0.25s ease;
  }
  @keyframes fadeIn{ from{ opacity: 0; transform: translateY(4px); } to{ opacity: 1; transform: translateY(0); } }

  #content p{ margin: 0 0 14px; }
  #content h2{
    font-family: var(--font-display);
    font-size: 17px;
    font-weight: 600;
    color: var(--accent);
    margin: 22px 0 10px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--border);
  }
  #content h2:first-child{ margin-top: 0; }
  #content b{ color: var(--accent-teal-strong); font-weight: 700; }
  #content img{ max-width: 100%; height: auto; border-radius: var(--radius-sm); display: block; }
  #content > img{ margin: 10px 0 16px; box-shadow: var(--shadow); }
  #content a{ font-weight: 600; text-decoration: underline; text-decoration-color: rgba(95,212,196,0.4); text-underline-offset: 3px; }

  .table-wrap{
    overflow-x: auto;
    margin: 4px 0 18px;
    border-radius: var(--radius-md);
    border: 1px solid var(--border);
    background: var(--surface);
  }
  table.table-style{
    border-collapse: collapse;
    width: 100%;
    min-width: 560px;
  }
  .table-style td, .table-style th{
    border: 1px solid var(--border);
    padding: 14px 16px;
    text-align: left;
    vertical-align: top;
  }
  .table-style th{
    background: var(--surface-2);
    font-family: var(--font-display);
    font-size: 12.5px;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--accent);
  }
  .table-style tr:nth-child(even) td{ background: rgba(255,255,255,0.015); }
  .table-style h2{
    margin: 0;
    padding: 0;
    border: none;
    width: 34px; height: 34px;
    border-radius: 50%;
    background: var(--surface-3);
    color: var(--accent);
    font-family: var(--font-display);
    font-size: 14px;
    display: flex; align-items: center; justify-content: center;
  }
  .table-style img{ margin: 0; }

  .empty-state{
    color: var(--text-muted);
    font-size: 14px;
    padding: 40px 0;
    text-align: center;
  }

  /* ---------- Mobile ---------- */
  @media (max-width: 860px){
    body{ flex-direction: column; }
    #mobile-topbar{ display: flex; }
    #sidebar{
      position: fixed;
      top: 0; bottom: 0; left: 0;
      transform: translateX(-100%);
      width: min(82vw, 300px);
      z-index: 950;
      box-shadow: var(--shadow);
      padding-top: var(--topbar-h);
      transition: transform 0.25s ease;
    }
    #sidebar.open{ transform: translateX(0); }
    .app{ display: block; }
    #main{ margin-top: var(--topbar-h); }
    .content-header{ padding: 20px 18px 14px; }
    #fight-title{ font-size: 21px; }
    .phase-rail-wrap{ padding: 12px 16px; }
    .strategy-bar{ padding: 12px 16px; }
    .content-panel{ padding: 18px 16px 44px; }
    #content{ font-size: 14.5px; }
  }
</style>
</head>
<body>
<script>
  // Prototype logo (inline flame/bonfire glyph) used as a fallback if
  // assets/images/logo.png hasn't been added to the repo yet.
  var PLACEHOLDER_LOGO = "data:image/svg+xml;utf8," + encodeURIComponent(
    '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48">' +
    '<rect width="48" height="48" rx="11" fill="#1a2038"/>' +
    '<path d="M24 6c2 6-4 8-4 13 0 3 2 5 5 5s5-2.5 5-6c3 3 5 7 5 11 0 7.2-5.8 13-13 13S9 36.2 9 29c0-6 3-10 6-14 1.5 3 3 4 5 4 3 0 4-3 2-7 1 0 2 0 2-1-1-2-1-3 0-5z" ' +
    'fill="#e0b454" stroke="#f2c96b" stroke-width="1"/>' +
    '</svg>'
  );
</script>

<div id="mobile-topbar">
  <div id="menu-btn" onclick="toggleMenu()" role="button" aria-label="開啟選單" tabindex="0">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>
  </div>
  <div id="mobile-title-row" onclick="goHome()">
    <img class="brand-logo" src="assets/images/logo.png" alt="篝火閣" onerror="this.onerror=null;this.src=PLACEHOLDER_LOGO;">
    <div id="mobile-title">篝火閣</div>
  </div>
  <div id="mobile-theme-btn" onclick="toggleTheme()" role="button" aria-label="切換主題" tabindex="0">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
  </div>
</div>

<div id="backdrop" onclick="closeMenu()"></div>

<div class="app">
  <div id="sidebar">
    <div class="sidebar-brand">
      <div class="sidebar-brand-eyebrow">FFXIV · Ultimate Notes</div>
      <div class="sidebar-brand-row" onclick="goHome()" role="button" tabindex="0" aria-label="回到首頁">
        <img class="brand-logo" src="assets/images/logo.png" alt="篝火閣" onerror="this.onerror=null;this.src=PLACEHOLDER_LOGO;">
        <div>
          <div class="sidebar-brand-name">篝火閣</div>
          <div class="sidebar-brand-sub">地方的哈魯不想讓你知道的攻略整合站</div>
        </div>
      </div>
    </div>
    <div class="sidebar-search">
      <div class="sidebar-search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input id="fightSearch" type="text" placeholder="搜尋副本名稱..." oninput="renderFights()" aria-label="搜尋副本">
      </div>
    </div>
    <nav id="fightList" aria-label="副本清單"></nav>
    <div class="sidebar-bottom">
      <div class="control-box" id="themeToggle" onclick="toggleTheme()" role="button" tabindex="0">
        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        <span id="themeLabel">切換為淺色模式</span>
      </div>
      <div class="sidebar-credit">僅供親友參考 · 內容持續更新中</div>
    </div>
  </div>

  <div id="main">
    <div class="content-header">
      <div class="breadcrumb" id="breadcrumb"></div>
      <div id="fight-title">地方的哈魯不想讓你知道的攻略整合站</div>
      <div id="fight-desc">此攻略網主要是筆者為筆者的親友所建設，但不限於任何路過的參考或分享。有任何錯漏或建議歡迎告知筆者本人，不過筆者很懶。<br>
      筆者只是為外語不好的親友整合筆者認為更可取的打法，筆者並非六絶亦不是99大佬，請不要抱有任何期待。o3o</div>
    </div>
    <div class="phase-rail-wrap">
      <div id="phase-tabs" class="phase-rail"></div>
    </div>
    <div id="strategy-buttons" class="strategy-bar"></div>
    <div class="content-panel">
      <div id="content"></div>
    </div>
  </div>
</div>

<script>
const replacementDict = {
  "{tank_icon}": '<img src="tank.png" style="height:20px;vertical-align:middle;">',
  "{heal_icon}": '<img src="heal.png" style="height:20px;vertical-align:middle;">',
  "{job:mt}": '<img src="assets/images/jobs/war.png" style="height:20px;vertical-align:middle;">',
  "{job:st}": '<img src="assets/images/jobs/pld.png" style="height:20px;vertical-align:middle;">',
  "{job:h1}": '<img src="assets/images/jobs/ast.png" style="height:20px;vertical-align:middle;">',
  "{job:h2}": '<img src="assets/images/jobs/sge.png" style="height:20px;vertical-align:middle;">',
  "{job:d1}": '<img src="assets/images/jobs/mnk.png" style="height:20px;vertical-align:middle;">',
  "{job:d2}": '<img src="assets/images/jobs/sam.png" style="height:20px;vertical-align:middle;">',
  "{job:d3}": '<img src="assets/images/jobs/dnc.png" style="height:20px;vertical-align:middle;">',
  "{job:d4}": '<img src="assets/images/jobs/smn.png" style="height:20px;vertical-align:middle;">',
  "{waymark:a}": '<img src="assets/images/waymark/waymarkA.png" style="height:20px;vertical-align:middle;">',
  "{waymark:b}": '<img src="assets/images/waymark/waymarkB.png" style="height:20px;vertical-align:middle;">',

function renderFights() {
  const container = document.getElementById('fightList');
  const query = (document.getElementById('fightSearch').value || '').trim().toLowerCase();
  container.innerHTML = '';

  const names = Object.keys(data).filter(name => name.toLowerCase().includes(query));

  if (names.length === 0) {
    const empty = document.createElement('div');
    empty.className = 'fight-empty';
    empty.innerText = '找不到符合的副本';
    container.appendChild(empty);
    return;
  }

  names.forEach(fight => {
    const div = document.createElement('div');
    div.className = 'fight-item' + (fight === currentFight ? ' active' : '');
    div.setAttribute('role', 'button');
    div.setAttribute('tabindex', '0');

    const dot = document.createElement('span');
    dot.className = 'fight-item-dot';

    const text = document.createElement('span');
    text.className = 'fight-item-text';
    text.innerText = fight;

    div.appendChild(dot);
    div.appendChild(text);

    const activate = () => { selectFight(fight); closeMenu(); };
    div.onclick = activate;
    div.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(); } };

    container.appendChild(div);
  });
}

     #fight=tea&phase=2                  -> fight + phase (by 1-based order)
     #fight=tea&phase=p2&strat=naur      -> fight + phase + strategy (by tag)
   Any tag that doesn't match the data falls back gracefully:
   an unknown fight tag returns to the home page; an unknown
   phase/strategy tag simply falls back to that fight's first
   phase/strategy instead of discarding a valid fight match.
   ------------------------------------------------------------- */

function findFightKeyByTag(tag) {
  if (!tag) return null;
  const t = String(tag).toLowerCase();
  return Object.keys(data).find(k => (data[k].tag || '').toLowerCase() === t) || null;
}

function findPhaseKeyByTag(fightKey, tag) {
  if (!tag || !data[fightKey]) return null;
  const phases = data[fightKey].phases;
  const keys = Object.keys(phases);
  const t = String(tag);
  if (/^\d+$/.test(t)) {
    const idx = parseInt(t, 10) - 1;
    return (idx >= 0 && idx < keys.length) ? keys[idx] : null;
  }
  const lower = t.toLowerCase();
  return keys.find(k => (phases[k].tag || '').toLowerCase() === lower) || null;
}

function findStrategyKeyByTag(fightKey, phaseKey, tag) {
  if (!tag || !phaseKey || !data[fightKey] || !data[fightKey].phases[phaseKey]) return null;
  const strategies = data[fightKey].phases[phaseKey].strategies;
  const t = String(tag).toLowerCase();
  return Object.keys(strategies).find(k => (strategies[k].tag || '').toLowerCase() === t) || null;
}

function parseHash() {
  let raw = location.hash || '';
  if (raw.charAt(0) === '#') raw = raw.slice(1);
  raw = raw.trim();
  if (!raw) return null;

  let fightTag = null, phaseTag = null, stratTag = null;

  if (raw.indexOf('=') === -1 && raw.indexOf(':') !== -1) {
    // shorthand form: fight:tea
    const m = raw.match(/^fight:(.+)$/i);
    if (m) fightTag = decodeURIComponent(m[1]);
  } else {
    const params = new URLSearchParams(raw);
    if (params.has('fight')) fightTag = params.get('fight');
    if (params.has('phase')) phaseTag = params.get('phase');
    if (params.has('strat')) stratTag = params.get('strat');
  }
  return { fightTag, phaseTag, stratTag };
}

function updateHash() {
  let newHash = '';
  if (currentFight && data[currentFight]) {
    const parts = ['fight=' + encodeURIComponent(data[currentFight].tag)];
    if (currentPhase && data[currentFight].phases[currentPhase]) {
      parts.push('phase=' + encodeURIComponent(data[currentFight].phases[currentPhase].tag));
      const strategies = data[currentFight].phases[currentPhase].strategies;
      if (currentStrategy && strategies[currentStrategy]) {
        parts.push('strat=' + encodeURIComponent(strategies[currentStrategy].tag));
      }
    }
    newHash = '#' + parts.join('&');
  }
  if ((location.hash || '') !== newHash) {
    const base = location.pathname + location.search;
    history.replaceState(null, '', newHash ? base + newHash : base);
  }
}

function applyHashRoute() {
  const parsed = parseHash();
  if (!parsed || !parsed.fightTag) { goHome(); return; }

  const fightKey = findFightKeyByTag(parsed.fightTag);
  if (!fightKey) { goHome(); return; } // unmatched tag -> home page, and the bad hash is cleared

  const phaseKey = parsed.phaseTag ? findPhaseKeyByTag(fightKey, parsed.phaseTag) : null;
  const stratKey = (phaseKey && parsed.stratTag) ? findStrategyKeyByTag(fightKey, phaseKey, parsed.stratTag) : null;

  // skipHashUpdate: true avoids rewriting a hash that's already valid; showContent()
  // still normalizes it (e.g. a numeric phase index becomes its canonical tag) the
  // next time the person interacts with the page.
  selectFight(fightKey, { phase: phaseKey, strategy: stratKey, skipHashUpdate: true });
}

function updateBreadcrumb() {
  const bc = document.getElementById('breadcrumb');
  if (!currentFight) { bc.innerHTML = ''; return; }
  let parts = [`<span onclick="goHome()" style="cursor:pointer;">副本列表</span>`, `<span>›</span>`, `<span class="crumb-accent">${currentFight}</span>`];
  if (currentPhase && Object.keys(data[currentFight].phases).length > 1) {
    parts.push('<span>›</span>');
    parts.push(`<span class="crumb-accent">${currentPhase}</span>`);
  }
  bc.innerHTML = parts.join(' ');
}

function goHome(opts) {
  opts = opts || {};
  currentFight = null;
  currentPhase = null;
  currentStrategy = null;
  document.getElementById('fight-title').innerText = DEFAULT_TITLE;
  document.getElementById('fight-desc').innerHTML = DEFAULT_DESC;
  document.getElementById('phase-tabs').innerHTML = '';
  document.getElementById('strategy-buttons').innerHTML = '';
  document.getElementById('content').innerHTML = '';
  updateBreadcrumb();
  renderFights();
  closeMenu();
  if (!opts.skipHashUpdate) updateHash();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function selectFight(fight, opts) {
  opts = opts || {};
  currentFight = fight;
  document.getElementById('fight-title').innerText = fight;
  document.getElementById('fight-desc').innerHTML = applyReplacements(data[fight].description) || '';
  renderFights();
  renderPhases(opts.phase, opts.strategy, opts.skipHashUpdate);
  updateBreadcrumb();
  closeMenu();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderPhases(preferredPhase, preferredStrategy, skipHashUpdate) {
  const phaseTabs = document.getElementById('phase-tabs');
  phaseTabs.innerHTML = '';
  const phases = data[currentFight].phases;
  const keys = Object.keys(phases);

  if (keys.length <= 1) {
    currentPhase = keys[0];
    renderStrategies(preferredStrategy, skipHashUpdate);
    updateBreadcrumb();
    return;
  }

  keys.forEach((phase, idx) => {
    if (idx > 0) {
      const connector = document.createElement('div');
      connector.className = 'phase-connector';
      phaseTabs.appendChild(connector);
    }

    const tab = document.createElement('div');
    tab.className = 'phase-tab';
    tab.dataset.phase = phase;
    tab.setAttribute('role', 'tab');
    tab.setAttribute('tabindex', '0');

    const num = document.createElement('span');
    num.className = 'phase-num';
    num.innerText = idx + 1;

    const label = document.createElement('span');
    label.className = 'phase-label';
    label.innerText = phase;

    tab.appendChild(num);
    tab.appendChild(label);

    const activate = () => {
      currentPhase = phase;
      renderStrategies();
      document.querySelectorAll('.phase-tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      updateBreadcrumb();
    };
    tab.onclick = activate;
    tab.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(); } };

    phaseTabs.appendChild(tab);
  });

  const tabs = Array.from(phaseTabs.querySelectorAll('.phase-tab'));
  currentPhase = (preferredPhase && phases[preferredPhase]) ? preferredPhase : keys[0];
  const matchTab = tabs.find(t => t.dataset.phase === currentPhase) || tabs[0];
  if (matchTab) matchTab.classList.add('active');
  renderStrategies(preferredStrategy, skipHashUpdate);
}

function renderStrategies(preferredStrategy, skipHashUpdate) {
  const container = document.getElementById('strategy-buttons');
  container.innerHTML = '';
  const strategies = data[currentFight].phases[currentPhase].strategies;
  const keys = Object.keys(strategies);

  keys.forEach(name => {
    const btn = document.createElement('div');
    btn.className = 'strategy-btn';
    btn.dataset.strategy = name;
    btn.innerText = name;
    btn.setAttribute('role', 'button');
    btn.setAttribute('tabindex', '0');
    btn.onclick = () => showContent(name, btn);
    btn.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); showContent(name, btn); } };
    container.appendChild(btn);
  });

  const target = (preferredStrategy && strategies[preferredStrategy]) ? preferredStrategy : keys[0];
  if (target) {
    const targetBtn = Array.from(container.children).find(b => b.dataset.strategy === target);
    showContent(target, targetBtn, skipHashUpdate);
  }
}

function showContent(name, btnElement, skipHashUpdate) {
  currentStrategy = name;
  document.querySelectorAll('.strategy-btn').forEach(b => b.classList.remove('active'));
  if (btnElement) btnElement.classList.add('active');

  const contentDiv = document.getElementById('content');
  let raw = data[currentFight].phases[currentPhase].strategies[name].content;
  let html = applyReplacements(raw);
  html = html.replace(/<table class="table-style">/g, '<div class="table-wrap"><table class="table-style">');
  html = html.replace(/<\/table>/g, '</table></div>');
  contentDiv.innerHTML = html;

  if (!skipHashUpdate) updateHash();
}

function applyTheme(isLight) {
  document.body.classList.toggle('light', isLight);
  const label = document.getElementById('themeLabel');
  const arcPath = 'M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z';
  const sunPaths = `<circle cx="12" cy="12" r="4"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>`;
  if (label) label.innerText = isLight ? '切換為深色模式' : '切換為淺色模式';
  document.querySelectorAll('#themeIcon, #mobile-theme-btn svg').forEach(icon => {
    icon.innerHTML = isLight ? sunPaths : `<path d="${arcPath}"></path>`;
  });
}

function toggleTheme() {
  const isLight = !document.body.classList.contains('light');
  applyTheme(isLight);
  try { localStorage.setItem('strat-theme', isLight ? 'light' : 'dark'); } catch (e) {}
}

function toggleMenu() {
  document.getElementById('sidebar').classList.toggle('open');
  document.getElementById('backdrop').classList.toggle('show');
}

function closeMenu() {
  document.getElementById('sidebar').classList.remove('open');
  document.getElementById('backdrop').classList.remove('show');
}

window.addEventListener('hashchange', applyHashRoute);

(function init() {
  let saved = null;
  try { saved = localStorage.getItem('strat-theme'); } catch (e) {}
  applyTheme(saved === 'light');
  applyHashRoute();
})();
</script>
